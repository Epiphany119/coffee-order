# 线上开发环境配置（连接线上数据库）
# AI 密钥通过环境变量 ZHIPU_API_KEY 提供

spring:
  datasource:
    url: ${COFFEE_DB_URL}
    username: ${COFFEE_DB_USERNAME}
    password: ${COFFEE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cache:
    type: simple
  cloud:
    service-registry:
      auto-registration:
        enabled: false
    nacos:
      discovery:
        enabled: false
        register-enabled: false

management:
  health:
    redis:
      enabled: false

coffee:
  auth:
    token-secret: ${COFFEE_AUTH_TOKEN_SECRET}
    token-expires-seconds: 28800
    expose-reset-token: ${COFFEE_AUTH_EXPOSE_RESET_TOKEN:false}
  payment:
    callback-secret: ${COFFEE_PAYMENT_CALLBACK_SECRET}
    mock-callback-enabled: ${COFFEE_PAYMENT_MOCK_CALLBACK_ENABLED:false}
  seat:
    qr-base-url: ${COFFEE_QR_BASE_URL:http://localhost:5174}
    store-name: 静安店
    assign-timeout-minutes: 15
  inventory:
    redis-cache-enabled: false
  membership:
    async-enabled: false
  flash-sale:
    redis-enabled: false
    claim-expire-scan-ms: 30000
