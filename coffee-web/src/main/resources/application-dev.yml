    token-secret: change-this-development-secret-before-production-2026
    token-expires-seconds: 28800
  payment:
    callback-secret: change-this-callback-secret-before-production-2026
  seat:
    qr-base-url: http://192.168.31.42:5173
    store-name: 静安店
    assign-timeout-minutes: 15
  inventory:
    redis-cache-enabled: false
  membership:
    async-enabled: false
  flash-sale:
    # 本地仍由 MySQL 条件更新兜底；不开 Redis 也可联调。
    redis-enabled: false
    claim-expire-scan-ms: 30000
