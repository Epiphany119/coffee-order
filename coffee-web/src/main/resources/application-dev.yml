# 本机开发环境：无需启动 Nacos、Redis、RocketMQ 即可运行。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/coffee_order_pro?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: epiphany
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  cache:
    type: simple
  cloud:
    service-registry:
      auto-registration:
        enabled: false
    nacos:
      discovery:
        enabled: false
        register-enabled: false

management:
  health:
    redis:
      enabled: false

coffee:
