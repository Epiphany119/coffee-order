server:
  port: 8088

spring:
  application:
    name: coffee-web
  servlet:
    multipart:
      # 个人头像、商家经营许可证的业务校验上限为 5MB；这里要同步放开容器默认的 1MB 限制。
      max-file-size: ${COFFEE_UPLOAD_MAX_FILE_SIZE:5MB}
      # 预留 multipart 请求头开销，避免恰好 5MB 的图片被请求总大小拦截。
      max-request-size: ${COFFEE_UPLOAD_MAX_REQUEST_SIZE:6MB}
  datasource:
    # 默认仅提供本机地址，账号、密码必须由环境变量注入。
    url: ${COFFEE_DB_URL:jdbc:mysql://127.0.0.1:3306/coffee_order_pro?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${COFFEE_DB_USERNAME}
    password: ${COFFEE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # QQ SMTP 公共占位配置；local profile 会由 application-local.yml 覆盖账号和授权码。
  # 非 local 环境优先读取 COFFEE_MAIL_*，兼容 travel-agent 已使用的 QQ_MAIL_*，不放真实凭证。
  mail:
    host: ${COFFEE_MAIL_HOST:${QQ_MAIL_HOST:smtp.qq.com}}
    port: ${COFFEE_MAIL_PORT:${QQ_MAIL_PORT:465}}
    username: ${COFFEE_MAIL_USERNAME:${QQ_MAIL_USERNAME:}}
    password: ${COFFEE_MAIL_PASSWORD:${QQ_MAIL_PASSWORD:}}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.auth.mechanisms: LOGIN
      mail.smtp.starttls.enable: false
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.trust: smtp.qq.com
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.from: ${spring.mail.username}
      mail.smtp.allow8bitmime: true
      mail.mime.charset: UTF-8
  data:
    redis:
      # 邮箱验证码优先写 Redis；服务会自动以 MySQL 作为丢失/不可用时的校验兜底。
      host: ${COFFEE_REDIS_HOST:127.0.0.1}
      port: ${COFFEE_REDIS_PORT:6379}
      password: ${COFFEE_REDIS_PASSWORD:}
      timeout: ${COFFEE_REDIS_TIMEOUT:2s}
  cache:
    type: simple
  cloud:
    service-registry:
      auto-registration:
        enabled: false
    nacos:
      discovery:
        enabled: false
        register-enabled: false
  # ============================================================
  # 配置切换说明：
  #   local  - 本地开发（可选使用 application-local.yml 覆盖）
  #   dev    - 线上开发（使用 application-dev.yml 的线上数据库配置）
  # 可通过 SPRING_PROFILES_ACTIVE 切换环境，默认 local
  # ============================================================
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

management:
  tracing:
    sampling:
      probability: ${COFFEE_TRACE_SAMPLE_PROBABILITY:1.0}
  health:
    redis:
      # 默认使用本地缓存，不启动 Redis 时无需产生连接失败告警。
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: FIKA coffee retail platform
    architecture: modular-monolith
    java: 17

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志走 slf4j，级别由下方 logging.level 控制（默认 INFO 不打印 SQL，需要调试时临时调 DEBUG）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# 默认配置只提供安全占位值；数据库、令牌和回调密钥必须通过环境变量注入。
coffee:
  auth:
    # 空值会让 TokenService 拒绝启动，避免误用开发密钥。
    token-secret: ${COFFEE_AUTH_TOKEN_SECRET:}
    token-expires-seconds: ${COFFEE_AUTH_TOKEN_EXPIRES_SECONDS:28800}
    expose-reset-token: ${COFFEE_AUTH_EXPOSE_RESET_TOKEN:false}
    email-code:
      expires-seconds: ${COFFEE_EMAIL_CODE_EXPIRES_SECONDS:300}
      cooldown-seconds: ${COFFEE_EMAIL_CODE_COOLDOWN_SECONDS:60}
      max-attempts: ${COFFEE_EMAIL_CODE_MAX_ATTEMPTS:5}
      # 10 分钟窗口最多成功申请 5 次，第 6 次开始冷却 10 分钟。
      window-seconds: ${COFFEE_EMAIL_CODE_WINDOW_SECONDS:600}
      max-requests-per-window: ${COFFEE_EMAIL_CODE_MAX_REQUESTS_PER_WINDOW:5}
      lock-seconds: ${COFFEE_EMAIL_CODE_LOCK_SECONDS:600}
      cleanup-interval-ms: ${COFFEE_EMAIL_CODE_CLEANUP_INTERVAL_MS:60000}
  payment:
    callback-secret: ${COFFEE_PAYMENT_CALLBACK_SECRET:}
    mock-callback-enabled: ${COFFEE_PAYMENT_MOCK_CALLBACK_ENABLED:false}
  seat:
    qr-base-url: ${COFFEE_QR_BASE_URL:http://localhost:5174}
    store-name: ${COFFEE_STORE_NAME:FIKA}
    assign-timeout-minutes: ${COFFEE_SEAT_ASSIGN_TIMEOUT_MINUTES:15}
  inventory:
    redis-cache-enabled: false
  membership:
    async-enabled: false
  flash-sale:
    redis-enabled: false
  web:
    cors:
      allowed-origins: ${COFFEE_CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}
  ai:
    platform:
      # 当前采用 GLM 路由 + 后端受控工具编排；未来接入 Spring AI Alibaba 时只替换适配器。
      provider: ${COFFEE_AI_PLATFORM_PROVIDER:glm}
    # 静安店为 Agent 样板门店；其他门店沿用通用 GLM 提示词与输出。
    template-store-code: ${COFFEE_AI_TEMPLATE_STORE_CODE:jingan}
    zhipu:
      # 通过环境变量提供，切勿将真实密钥提交到仓库。
      # 同时兼容智谱 SDK 常用的 ZAI_API_KEY。
      api-key: ${ZHIPU_API_KEY:${ZAI_API_KEY:}}
      endpoint: ${ZHIPU_ENDPOINT:https://open.bigmodel.cn/api/paas/v4/chat/completions}
      model: ${ZHIPU_MODEL:glm-4.5-air}
      embedding-endpoint: ${ZHIPU_EMBEDDING_ENDPOINT:https://open.bigmodel.cn/api/paas/v4/embeddings}
      embedding-model: ${ZHIPU_EMBEDDING_MODEL:embedding-3}
      # 512 维兼顾中文菜单召回质量、MySQL 缓存体积和接口成本。
      embedding-dimensions: ${ZHIPU_EMBEDDING_DIMENSIONS:512}
      # 交互型 Agent 的时间预算；超时会立即回退到受控规则方案。
      timeout-seconds: ${ZHIPU_TIMEOUT_SECONDS:15}
      # Chat 模型首包延迟更长，独立给 25 秒预算；流式响应在生成完成后立即释放连接。
      chat-timeout-seconds: ${ZHIPU_CHAT_TIMEOUT_SECONDS:25}
    milvus:
      # Docker 默认暴露的 gRPC 端口；关闭开关时自动回退 MySQL 关键词检索。
      enabled: ${MILVUS_ENABLED:true}
      host: ${MILVUS_HOST:localhost}
      port: ${MILVUS_PORT:19530}
      collection: ${MILVUS_COLLECTION:agent_knowledge_vector}
      token: ${MILVUS_TOKEN:}
      connect-timeout-seconds: ${MILVUS_CONNECT_TIMEOUT_SECONDS:5}
  outbox:
    dispatch-interval-ms: 3000

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-} span=%X{spanId:-}]"
  level:
    com.coffee: INFO
