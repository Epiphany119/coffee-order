server:
  port: 8088

spring:
  application:
    name: coffee-web
  profiles:
    default: dev

management:
  tracing:
    sampling:
      probability: ${COFFEE_TRACE_SAMPLE_PROBABILITY:1.0}
  health:
    redis:
      # 默认使用本地缓存，不启动 Redis 时无需产生连接失败告警。
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: FIKA coffee retail platform
    architecture: modular-monolith
    java: 17

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志走 slf4j，级别由下方 logging.level 控制（默认 INFO 不打印 SQL，需要调试时临时调 DEBUG）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# 仅包含与环境无关的业务配置；数据库、中间件、密钥等均见 application-dev/prod.yml。
coffee:
  outbox:
    dispatch-interval-ms: 3000

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-} span=%X{spanId:-}]"
  level:
    com.coffee: INFO
